<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball - Personagens</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 32px 16px;
      background: linear-gradient(120deg, #e85d04, #f48c06);
    }
    header h1 { margin: 0 0 8px; }
    main { width: min(1000px, 92%); margin: 28px auto; }
    .formulario {
      background: #1d293b;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 28px;
    }
    .formulario h2 { margin-top: 0; }
    form {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 7px;
      font-size: 15px;
    }
    input { background: #fff; color: #111; }
    button {
      grid-column: 1 / -1;
      background: #f48c06;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #ffb02e; }
    #mensagem { min-height: 20px; margin-bottom: 0; }
    .personagens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }
    .card {
      background: #1d293b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
    }
    .card h3 { margin-bottom: 8px; color: #ffb02e; }
    .card p { margin: 6px 0; }
    @media (max-width: 600px) {
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Dragon Ball</h1>
    <p>Cadastre e consulte seus personagens favoritos</p>
  </header>

  <main>
    <section class="formulario">
      <h2>Cadastrar personagem</h2>
      <form id="formPersonagem">
        <input id="nome" type="text" placeholder="Nome do personagem" required>
        <input id="ki" type="number" min="0" placeholder="Nível de ki" required>
        <input id="imagem" type="url" placeholder="Link da imagem" required>
        <input id="idade" type="number" min="0" placeholder="Idade" required>
        <button type="submit">Cadastrar personagem</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <section>
      <h2>Personagens cadastrados</h2>
      <div id="listaPersonagens" class="personagens"></div>
    </section>
  </main>

  <script>
    const API = "http://localhost:3000/personagens";
    const lista = document.getElementById("listaPersonagens");
    const mensagem = document.getElementById("mensagem");
    const formulario = document.getElementById("formPersonagem");

    async function carregarPersonagens() {
      try {
        const resposta = await fetch(API);
        if (!resposta.ok) throw new Error("Não foi possível buscar os personagens.");

        const personagens = await resposta.json();
        lista.replaceChildren();

        personagens.forEach((personagem) => {
          const card = document.createElement("article");
          card.className = "card";

          const imagem = document.createElement("img");
          imagem.src = personagem.imagem;
          imagem.alt = `Imagem de ${personagem.nome}`;
          imagem.onerror = () => {
            imagem.src = "https://placehold.co/300x180?text=Sem+imagem";
          };

          const nome = document.createElement("h3");
          nome.textContent = personagem.nome;

          const ki = document.createElement("p");
          ki.textContent = `Ki: ${personagem.ki}`;

          const idade = document.createElement("p");
          idade.textContent = `Idade: ${personagem.idade} anos`;

          card.append(imagem, nome, ki, idade);
          lista.appendChild(card);
        });
      } catch (erro) {
        mensagem.textContent = "Erro ao carregar. Confira se o servidor está ligado.";
      }
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const novoPersonagem = {
        nome: document.getElementById("nome").value.trim(),
        ki: Number(document.getElementById("ki").value),
        imagem: document.getElementById("imagem").value.trim(),
        idade: Number(document.getElementById("idade").value)
      };

      try {
        const resposta = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(novoPersonagem)
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
          mensagem.textContent = resultado.mensagem || "Não foi possível cadastrar.";
          return;
        }

        mensagem.textContent = "Personagem cadastrado com sucesso!";
        formulario.reset();
        carregarPersonagens();
      } catch (erro) {
        mensagem.textContent = "Erro ao cadastrar. Confira se o servidor está ligado.";
      }
    });

    carregarPersonagens();
  </script>
</body>
</html>
